[project]
name = "seminario-masked-modeling"
version = "0.1.0"
description = "Seminário: Masked Modeling em Deep Learning. MAE didático no CIFAR-10."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "numpy",
    "matplotlib",
    "pandas",
    "nbconvert",
    "jupyter",
    "ipykernel",
    "python-pptx",
]

[dependency-groups]
dev = [
    "vit-pytorch==1.24.1",
    "pytest",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]